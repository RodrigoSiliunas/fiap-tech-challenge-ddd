[project]
name = "oficina-mecanica"
version = "1.0.0"
description = "MVP do back-end da oficina mecânica — FIAP SOAT Tech Challenge Fase 1"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "psycopg[binary]",
    "pydantic>=2",
    "pydantic-settings",
    "PyJWT",
    "bcrypt",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["oficina"]
omit = ["tests/*"]
branch = false

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
