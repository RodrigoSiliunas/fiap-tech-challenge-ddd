<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1048" width="900" height="1048" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Fluxo da ordem de serviço</title>
  <desc id="descricao">Abrir a OS com cliente e veículo, iniciar diagnóstico, incluir serviços e peças, gerar orçamento, consulta do cliente; então rejeitar, ou aprovar com baixa de estoque, finalizar e entregar.</desc>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1120"/><stop offset="1" stop-color="#0f1a2e"/>
    </linearGradient>
    <linearGradient id="topo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5a524"/><stop offset=".55" stop-color="#ff7a45"/><stop offset="1" stop-color="#4c9aff"/>
    </linearGradient>
    <pattern id="pontos" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#1b2843"/>
    </pattern>
    <filter id="sombra" x="-10%" y="-15%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <marker id="seta" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#7385a1"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .k { font-size: 12px; font-weight: 700; letter-spacing: 3px; fill: #f5a524; }
    .t { font-size: 26px; font-weight: 700; fill: #eef2f8; }
    .s { font-size: 14px; fill: #a9b7cc; }
    .bt { font-size: 17px; font-weight: 700; fill: #eef2f8; }
    .p { font-family: 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12.5px; }
    .d { font-size: 13.5px; fill: #a9b7cc; }
    .m { font-size: 12.5px; fill: #7385a1; }
    .lbl { font-size: 11.5px; font-weight: 600; fill: #a9b7cc; }
    .chip { font-size: 10.5px; font-weight: 700; letter-spacing: 1.5px; }
    .seta { stroke: #7385a1; stroke-width: 1.8; fill: none; }
  </style>
  <rect width="900" height="1048" rx="20" fill="url(#fundo)"/>
  <rect width="900" height="1048" rx="20" fill="url(#pontos)" opacity=".6"/>
  <rect x="28" y="0" width="844" height="3" rx="1.5" fill="url(#topo)"/>
  <text class="k" x="36" y="42">FLUXO</text>
  <text class="t" x="36" y="74">Fluxo da ordem de serviço</text>
  <text class="s" x="36" y="98">O status muda no comando. Não existe endpoint para gravar o status à mão.</text>
  <text class="m" x="864" y="42" text-anchor="end">Rotas sob /api/v1</text>
  <rect x="110" y="128" width="754" height="118" rx="14" fill="#111c31" stroke="#26354f" filter="url(#sombra)"/>
  <rect x="111" y="142" width="4" height="90" rx="2" fill="#4c9aff"/>
  <text x="134" y="158" font-size="16" font-weight="700" fill="#eef2f8">Abrir a ordem de serviço</text>
  <text class="d" x="134" y="182">Identifica o cliente por CPF ou CNPJ.</text>
  <text class="d" x="134" y="202">Registra placa, marca, modelo e ano.</text>
  <text class="p" x="134" y="227" fill="#38bdf8" font-size="12">POST /ordens-servico</text>
  <rect x="764.4" y="141" width="83.6" height="24" rx="12" fill="#4c9aff" fill-opacity=".16" stroke="#4c9aff" stroke-opacity=".7"/><circle cx="777.4" cy="153" r="3.5" fill="#4c9aff"/><text x="786.4" y="157.3" font-size="12" font-weight="700" fill="#4c9aff">Recebida</text>
  <rect x="110" y="264" width="754" height="72" rx="14" fill="#111c31" stroke="#26354f" filter="url(#sombra)"/>
  <rect x="111" y="278" width="4" height="44" rx="2" fill="#4c9aff"/>
  <text x="134" y="294" font-size="16" font-weight="700" fill="#eef2f8">Iniciar diagnóstico</text>
  <text class="p" x="134" y="320" fill="#38bdf8" font-size="12">POST /ordens-servico/{id}/diagnostico</text>
  <rect x="721.2" y="277" width="126.8" height="24" rx="12" fill="#4c9aff" fill-opacity=".16" stroke="#4c9aff" stroke-opacity=".7"/><circle cx="734.2" cy="289" r="3.5" fill="#4c9aff"/><text x="743.2" y="293.3" font-size="12" font-weight="700" fill="#4c9aff">Em diagnóstico</text>
  <rect x="110" y="354" width="754" height="96" rx="14" fill="#111c31" stroke="#26354f" filter="url(#sombra)"/>
  <rect x="111" y="368" width="4" height="68" rx="2" fill="#4c9aff"/>
  <text x="134" y="384" font-size="16" font-weight="700" fill="#eef2f8">Incluir serviços e peças/insumos</text>
  <text class="d" x="134" y="408">Confere o saldo na inclusão. Não reserva estoque.</text>
  <text class="p" x="134" y="433" fill="#38bdf8" font-size="12">POST /ordens-servico/{id}/servicos  ·  /pecas</text>
  <rect x="110" y="468" width="754" height="96" rx="14" fill="#111c31" stroke="#26354f" filter="url(#sombra)"/>
  <rect x="111" y="482" width="4" height="68" rx="2" fill="#f5a524"/>
  <text x="134" y="498" font-size="16" font-weight="700" fill="#eef2f8">Gerar orçamento</text>
  <text class="d" x="134" y="522">Soma dos preços gravados nas linhas. Exige ao menos um serviço.</text>
  <text class="p" x="134" y="547" fill="#38bdf8" font-size="12">POST /ordens-servico/{id}/orcamento</text>
  <rect x="678.0" y="481" width="170.0" height="24" rx="12" fill="#f5a524" fill-opacity=".16" stroke="#f5a524" stroke-opacity=".7"/><circle cx="691.0" cy="493" r="3.5" fill="#f5a524"/><text x="700.0" y="497.3" font-size="12" font-weight="700" fill="#f5a524">Aguardando aprovação</text>
  <rect x="110" y="582" width="754" height="96" rx="14" fill="#111c31" stroke="#26354f" filter="url(#sombra)"/>
  <rect x="111" y="596" width="4" height="68" rx="2" fill="#38bdf8"/>
  <text x="134" y="612" font-size="16" font-weight="700" fill="#eef2f8">Consulta do cliente</text>
  <text class="d" x="134" y="636">Id da OS e CPF ou CNPJ. Sem JWT.</text>
  <text class="p" x="134" y="661" fill="#38bdf8" font-size="12">GET /publico/ordens-servico/{id}?documento=</text>
  <path d="M70 153 V607" stroke="#26354f" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
  <circle cx="70" cy="153" r="15" fill="#0a1120" stroke="#4c9aff" stroke-width="2"/><text x="70" y="157.6" text-anchor="middle" font-size="13" font-weight="800" fill="#4c9aff">1</text>
  <circle cx="70" cy="289" r="15" fill="#0a1120" stroke="#4c9aff" stroke-width="2"/><text x="70" y="293.6" text-anchor="middle" font-size="13" font-weight="800" fill="#4c9aff">2</text>
  <circle cx="70" cy="379" r="15" fill="#0a1120" stroke="#4c9aff" stroke-width="2"/><text x="70" y="383.6" text-anchor="middle" font-size="13" font-weight="800" fill="#4c9aff">3</text>
  <circle cx="70" cy="493" r="15" fill="#0a1120" stroke="#f5a524" stroke-width="2"/><text x="70" y="497.6" text-anchor="middle" font-size="13" font-weight="800" fill="#f5a524">4</text>
  <circle cx="70" cy="607" r="15" fill="#0a1120" stroke="#38bdf8" stroke-width="2"/><text x="70" y="611.6" text-anchor="middle" font-size="13" font-weight="800" fill="#38bdf8">5</text>
  <path class="seta" d="M487.0 678 V702 M290 702 H684"/>
  <path class="seta" d="M290 702 V726" marker-end="url(#seta)"/>
  <path class="seta" d="M684 702 V726" marker-end="url(#seta)"/>
  <rect x="110" y="728" width="360" height="96" rx="14" fill="#111c31" stroke="#26354f" filter="url(#sombra)"/>
  <rect x="111" y="742" width="4" height="68" rx="2" fill="#ff6b6b"/>
  <text x="134" y="758" font-size="16" font-weight="700" fill="#eef2f8">Rejeitar orçamento</text>
  <text class="d" x="134" y="782">A OS encerra neste status.</text>
  <text class="p" x="134" y="807" fill="#38bdf8" font-size="12">POST /publico/ordens-servico/{id}/rejeitar</text>
  <rect x="363.2" y="741" width="90.8" height="24" rx="12" fill="#ff6b6b" fill-opacity=".16" stroke="#ff6b6b" stroke-opacity=".7"/><circle cx="376.2" cy="753" r="3.5" fill="#ff6b6b"/><text x="385.2" y="757.3" font-size="12" font-weight="700" fill="#ff6b6b">Rejeitada</text>
  <rect x="504" y="728" width="360" height="96" rx="14" fill="#111c31" stroke="#26354f" filter="url(#sombra)"/>
  <rect x="505" y="742" width="4" height="68" rx="2" fill="#2fd08f"/>
  <text x="528" y="758" font-size="16" font-weight="700" fill="#eef2f8">Aprovar orçamento</text>
  <text class="d" x="528" y="782">Baixa o estoque na mesma transação.</text>
  <text class="p" x="528" y="807" fill="#38bdf8" font-size="12">POST /publico/ordens-servico/{id}/aprovar</text>
  <rect x="742.8" y="741" width="105.2" height="24" rx="12" fill="#2fd08f" fill-opacity=".16" stroke="#2fd08f" stroke-opacity=".7"/><circle cx="755.8" cy="753" r="3.5" fill="#2fd08f"/><text x="764.8" y="757.3" font-size="12" font-weight="700" fill="#2fd08f">Em execução</text>
  <path class="seta" d="M684 824 V842" marker-end="url(#seta)"/>
  <rect x="504" y="846" width="360" height="72" rx="14" fill="#111c31" stroke="#26354f" filter="url(#sombra)"/>
  <rect x="505" y="860" width="4" height="44" rx="2" fill="#4c9aff"/>
  <text x="528" y="876" font-size="16" font-weight="700" fill="#eef2f8">Finalizar serviço</text>
  <text class="p" x="528" y="902" fill="#38bdf8" font-size="12">POST /ordens-servico/{id}/finalizar</text>
  <rect x="750.0" y="859" width="98.0" height="24" rx="12" fill="#4c9aff" fill-opacity=".16" stroke="#4c9aff" stroke-opacity=".7"/><circle cx="763.0" cy="871" r="3.5" fill="#4c9aff"/><text x="772.0" y="875.3" font-size="12" font-weight="700" fill="#4c9aff">Finalizada</text>
  <path class="seta" d="M684 918 V936" marker-end="url(#seta)"/>
  <rect x="504" y="940" width="360" height="72" rx="14" fill="#111c31" stroke="#26354f" filter="url(#sombra)"/>
  <rect x="505" y="954" width="4" height="44" rx="2" fill="#2fd08f"/>
  <text x="528" y="970" font-size="16" font-weight="700" fill="#eef2f8">Entregar veículo</text>
  <text class="p" x="528" y="996" fill="#38bdf8" font-size="12">POST /ordens-servico/{id}/entregar</text>
  <rect x="764.4" y="953" width="83.6" height="24" rx="12" fill="#2fd08f" fill-opacity=".16" stroke="#2fd08f" stroke-opacity=".7"/><circle cx="777.4" cy="965" r="3.5" fill="#2fd08f"/><text x="786.4" y="969.3" font-size="12" font-weight="700" fill="#2fd08f">Entregue</text>
  <rect x="110" y="846" width="360" height="166" rx="14" fill="#16233d" stroke="#26354f" stroke-dasharray="4 5"/>
  <text class="k" x="134" y="878" fill="#94a3b8" style="fill:#94a3b8">REGRAS</text>
  <text class="d" x="134" y="908">Itens só mudam em Em diagnóstico e em</text>
  <text class="d" x="134" y="928">Aguardando aprovação. O total é recalculado.</text>
  <text class="d" x="134" y="960">O veículo só abre outra OS depois de</text>
  <text class="d" x="134" y="980">Entregue ou Rejeitada.</text>

</svg>
