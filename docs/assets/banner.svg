<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="titulo-banner descricao-banner">
  <title id="titulo-banner">Oficina Mecânica — Tech Challenge SOAT, Fase 1</title>
  <desc id="descricao-banner">Sistema integrado de atendimento e execução de serviços. Python 3.12, FastAPI, DDD, PostgreSQL 16, Docker e JWT. Linha do status da ordem de serviço, de Recebida a Entregue.</desc>
  <defs>
    <clipPath id="cartao"><rect width="1280" height="400" rx="24"/></clipPath>
    <linearGradient id="fundoBanner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d1a"/><stop offset=".55" stop-color="#0c1830"/><stop offset="1" stop-color="#0a1222"/>
    </linearGradient>
    <radialGradient id="brilhoAmbar" cx="1040" cy="40" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5a524" stop-opacity=".22"/><stop offset="1" stop-color="#f5a524" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brilhoAzul" cx="200" cy="400" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4c9aff" stop-opacity=".20"/><stop offset="1" stop-color="#4c9aff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grade" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1a2947" stroke-width="1"/>
    </pattern>
    <linearGradient id="feixe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ouro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5a524"/><stop offset="1" stop-color="#ff7a45"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7fb"/><stop offset="1" stop-color="#9fb0c8"/>
    </linearGradient>
    <linearGradient id="titulo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfdbec"/>
    </linearGradient>
    <linearGradient id="trilho" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4c9aff" stop-opacity=".25"/><stop offset=".5" stop-color="#f5a524" stop-opacity=".45"/>
      <stop offset="1" stop-color="#2fd08f" stop-opacity=".35"/>
    </linearGradient>
    <filter id="desfoque" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="6"/></filter>
    <mask id="chaveMascara" maskUnits="userSpaceOnUse" x="-80" y="-120" width="160" height="260">
      <rect x="-80" y="-120" width="160" height="260" fill="#000"/>
      <circle cx="0" cy="-58" r="36" fill="#fff"/>
      <rect x="-12" y="-40" width="24" height="150" rx="12" fill="#fff"/>
      <rect x="-13" y="-104" width="26" height="40" rx="3" fill="#000"/>
      <circle cx="0" cy="96" r="6.5" fill="#000"/>
    </mask>
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .k2 { font-size: 15px; font-weight: 700; letter-spacing: 4px; }
    .giro { transform-box: fill-box; transform-origin: center; animation: girar 32s linear infinite; }
    .giro-inv { transform-box: fill-box; transform-origin: center; animation: girar 20s linear infinite reverse; }
    .feixe { animation: varrer 10s ease-in-out infinite; }
    .grade { animation: deriva 14s linear infinite; }
    .pulso { animation: pulso 6s linear infinite; }
    .acende { opacity: 0; animation: acende 6s linear infinite backwards; }
    @keyframes girar { to { transform: rotate(360deg); } }
    @keyframes varrer { 0% { transform: translateX(-420px); } 55%, 100% { transform: translateX(1760px); } }
    @keyframes deriva { to { transform: translate(40px, 40px); } }
    @keyframes pulso { 0% { transform: translateX(0); opacity: 0; } 6% { transform: translateX(0); opacity: 1; }
                       88% { transform: translateX(756px); opacity: 1; } 100% { transform: translateX(756px); opacity: 0; } }
    @keyframes acende { 0% { opacity: 0; } 2% { opacity: 1; } 22% { opacity: 0; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .giro, .giro-inv, .feixe, .grade, .pulso, .acende { animation: none; }
    }
  </style>
  <g clip-path="url(#cartao)">
    <rect width="1280" height="400" fill="url(#fundoBanner)"/>
    <g class="grade" opacity=".55"><rect x="-40" y="-40" width="1360" height="480" fill="url(#grade)"/></g>
    <rect width="1280" height="400" fill="url(#brilhoAmbar)"/>
    <rect width="1280" height="400" fill="url(#brilhoAzul)"/>
    <g class="feixe"><rect x="0" y="-60" width="260" height="520" fill="url(#feixe)" transform="skewX(-18)"/></g>
  </g>
  <rect x=".5" y=".5" width="1279" height="399" rx="24" fill="none" stroke="#22314f"/>
  <rect x="40" y="0" width="1200" height="3" rx="1.5" fill="url(#ouro)"/>
  <circle cx="214" cy="186" r="150" fill="#f5a524" fill-opacity=".05"/>
