  <circle cx="214" cy="186" r="72" fill="#0b1426" stroke="#f5a524" stroke-opacity=".45" stroke-width="2"/>
  <circle cx="214" cy="186" r="58" fill="none" stroke="#f5a524" stroke-opacity=".18" stroke-dasharray="3 7"/>
  <g class="giro-inv"><path d="M322.5 250.7 L324.5 238.3 L335.5 238.3 L337.5 250.7 L347.0 253.8 L355.9 244.9 L364.9 251.4 L359.2 262.6 L365.1 270.7 L377.5 268.8 L380.9 279.3 L369.7 285.0 L369.7 295.0 L380.9 300.7 L377.5 311.2 L365.1 309.3 L359.2 317.4 L364.9 328.6 L355.9 335.1 L347.0 326.2 L337.5 329.3 L335.5 341.7 L324.5 341.7 L322.5 329.3 L313.0 326.2 L304.1 335.1 L295.1 328.6 L300.8 317.4 L294.9 309.3 L282.5 311.2 L279.1 300.7 L290.3 295.0 L290.3 285.0 L279.1 279.3 L282.5 268.8 L294.9 270.7 L300.8 262.6 L295.1 251.4 L304.1 244.9 L313.0 253.8Z" fill="#4c9aff" fill-opacity=".10" stroke="#4c9aff" stroke-width="2.5" stroke-linejoin="round"/></g>
  <circle cx="330" cy="290" r="17" fill="#0b1426" stroke="#4c9aff" stroke-opacity=".6" stroke-width="2"/>
  <g transform="translate(214 186) rotate(40)"><rect x="-80" y="-120" width="160" height="260" fill="url(#metal)" mask="url(#chaveMascara)"/></g>
  <text class="k2" x="440" y="112" fill="#f5a524">TECH CHALLENGE · SOAT · FASE 1</text>
  <text x="436" y="186" font-size="66" font-weight="700" fill="url(#titulo)" letter-spacing="-1">Oficina Mecânica</text>
  <text x="440" y="226" font-size="21" fill="#b7c4d9">Sistema integrado de atendimento e execução de serviços</text>
  <rect x="440.0" y="250" width="131.1" height="30" rx="15" fill="#111d35" stroke="#2a3b5c"/><circle cx="456.0" cy="265" r="4" fill="#4c9aff"/><text x="468.0" y="269.6" font-size="13.5" font-weight="600" fill="#dbe4f1">Python 3.12</text>
  <rect x="581.1" y="250" width="98.7" height="30" rx="15" fill="#111d35" stroke="#2a3b5c"/><circle cx="597.1" cy="265" r="4" fill="#2fd08f"/><text x="609.1" y="269.6" font-size="13.5" font-weight="600" fill="#dbe4f1">FastAPI</text>
  <rect x="689.8" y="250" width="66.3" height="30" rx="15" fill="#111d35" stroke="#2a3b5c"/><circle cx="705.8" cy="265" r="4" fill="#f5a524"/><text x="717.8" y="269.6" font-size="13.5" font-weight="600" fill="#dbe4f1">DDD</text>
  <rect x="766.1" y="250" width="147.3" height="30" rx="15" fill="#111d35" stroke="#2a3b5c"/><circle cx="782.1" cy="265" r="4" fill="#38bdf8"/><text x="794.1" y="269.6" font-size="13.5" font-weight="600" fill="#dbe4f1">PostgreSQL 16</text>
  <rect x="923.4" y="250" width="90.6" height="30" rx="15" fill="#111d35" stroke="#2a3b5c"/><circle cx="939.4" cy="265" r="4" fill="#4c9aff"/><text x="951.4" y="269.6" font-size="13.5" font-weight="600" fill="#dbe4f1">Docker</text>
  <rect x="1024.0" y="250" width="66.3" height="30" rx="15" fill="#111d35" stroke="#2a3b5c"/><circle cx="1040.0" cy="265" r="4" fill="#a78bfa"/><text x="1052.0" y="269.6" font-size="13.5" font-weight="600" fill="#dbe4f1">JWT</text>
  <rect x="440" y="338" width="756" height="4" rx="2" fill="url(#trilho)"/>
  <circle class="acende" style="animation-delay:0.36s" cx="440.0" cy="340" r="16" fill="#4c9aff" filter="url(#desfoque)"/>
  <circle cx="440.0" cy="340" r="8" fill="#0b1426" stroke="#4c9aff" stroke-width="2.5"/>
  <circle cx="440.0" cy="340" r="3" fill="#4c9aff"/>
  <text x="440.0" y="374" text-anchor="middle" font-size="12" font-weight="600" fill="#93a4bf">Recebida</text>
  <circle class="acende" style="animation-delay:1.34s" cx="591.2" cy="340" r="16" fill="#4c9aff" filter="url(#desfoque)"/>
  <circle cx="591.2" cy="340" r="8" fill="#0b1426" stroke="#4c9aff" stroke-width="2.5"/>
  <circle cx="591.2" cy="340" r="3" fill="#4c9aff"/>
  <text x="591.2" y="374" text-anchor="middle" font-size="12" font-weight="600" fill="#93a4bf">Em diagnóstico</text>
  <circle class="acende" style="animation-delay:2.33s" cx="742.4" cy="340" r="16" fill="#f5a524" filter="url(#desfoque)"/>
  <circle cx="742.4" cy="340" r="8" fill="#0b1426" stroke="#f5a524" stroke-width="2.5"/>
  <circle cx="742.4" cy="340" r="3" fill="#f5a524"/>
  <text x="742.4" y="374" text-anchor="middle" font-size="12" font-weight="600" fill="#93a4bf">Aguardando aprovação</text>
  <circle class="acende" style="animation-delay:3.31s" cx="893.6" cy="340" r="16" fill="#4c9aff" filter="url(#desfoque)"/>
  <circle cx="893.6" cy="340" r="8" fill="#0b1426" stroke="#4c9aff" stroke-width="2.5"/>
  <circle cx="893.6" cy="340" r="3" fill="#4c9aff"/>
  <text x="893.6" y="374" text-anchor="middle" font-size="12" font-weight="600" fill="#93a4bf">Em execução</text>
  <circle class="acende" style="animation-delay:4.30s" cx="1044.8" cy="340" r="16" fill="#4c9aff" filter="url(#desfoque)"/>
  <circle cx="1044.8" cy="340" r="8" fill="#0b1426" stroke="#4c9aff" stroke-width="2.5"/>
  <circle cx="1044.8" cy="340" r="3" fill="#4c9aff"/>
  <text x="1044.8" y="374" text-anchor="middle" font-size="12" font-weight="600" fill="#93a4bf">Finalizada</text>
  <circle class="acende" style="animation-delay:5.28s" cx="1196.0" cy="340" r="16" fill="#2fd08f" filter="url(#desfoque)"/>
  <circle cx="1196.0" cy="340" r="8" fill="#0b1426" stroke="#2fd08f" stroke-width="2.5"/>
  <circle cx="1196.0" cy="340" r="3" fill="#2fd08f"/>
  <text x="1196.0" y="374" text-anchor="middle" font-size="12" font-weight="600" fill="#93a4bf">Entregue</text>
  <g class="pulso"><circle cx="440" cy="340" r="10" fill="#f5a524" filter="url(#desfoque)"/><circle cx="440" cy="340" r="4.5" fill="#fff"/></g>
</svg>
