<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Arquitetura em camadas</title>
  <desc id="descricao">Monólito em quatro camadas: Interface, Aplicação, Domínio e Infraestrutura, com PostgreSQL 16. A aplicação usa o domínio e a infraestrutura; a infraestrutura implementa as portas do domínio.</desc>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1120"/><stop offset="1" stop-color="#0f1a2e"/>
    </linearGradient>
    <linearGradient id="topo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5a524"/><stop offset=".55" stop-color="#ff7a45"/><stop offset="1" stop-color="#4c9aff"/>
    </linearGradient>
    <pattern id="pontos" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#1b2843"/>
    </pattern>
    <filter id="sombra" x="-10%" y="-15%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <marker id="seta" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#7385a1"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .k { font-size: 12px; font-weight: 700; letter-spacing: 3px; fill: #f5a524; }
    .t { font-size: 26px; font-weight: 700; fill: #eef2f8; }
    .s { font-size: 14px; fill: #a9b7cc; }
    .bt { font-size: 17px; font-weight: 700; fill: #eef2f8; }
    .p { font-family: 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12.5px; }
    .d { font-size: 13.5px; fill: #a9b7cc; }
    .m { font-size: 12.5px; fill: #7385a1; }
    .lbl { font-size: 11.5px; font-weight: 600; fill: #a9b7cc; }
    .chip { font-size: 10.5px; font-weight: 700; letter-spacing: 1.5px; }
    .seta { stroke: #7385a1; stroke-width: 1.8; fill: none; }
  </style>
  <rect width="960" height="700" rx="20" fill="url(#fundo)"/>
  <rect width="960" height="700" rx="20" fill="url(#pontos)" opacity=".6"/>
  <rect x="28" y="0" width="904" height="3" rx="1.5" fill="url(#topo)"/>
  <text class="k" x="36" y="42">ARQUITETURA</text>
  <text class="t" x="36" y="74">Arquitetura em camadas</text>
  <text class="s" x="36" y="98">Monólito em um processo. A seta aponta para quem é chamado.</text>
  <path class="seta" d="M480 226 V258" marker-end="url(#seta)"/>
  <path class="seta" d="M330 360 V410" marker-end="url(#seta)"/>
  <path class="seta" d="M630 360 V410" marker-end="url(#seta)"/>
  <path class="seta" d="M538 474 H424" marker-end="url(#seta)"/>
  <path class="seta" d="M730 534 V576" marker-end="url(#seta)"/>
  <rect x="230" y="128" width="500" height="98" rx="14" fill="#111c31" stroke="#26354f" stroke-opacity="1" filter="url(#sombra)"/>
  <rect x="231" y="142" width="4" height="70" rx="2" fill="#4c9aff"/>
  <circle cx="272" cy="164" r="19" fill="#4c9aff" fill-opacity=".14" stroke="#4c9aff" stroke-opacity=".55"/>
  <g transform="translate(262.0 154.0) scale(0.8333)" fill="none" stroke="#4c9aff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/></g>
  <text class="bt" x="304" y="162">Interface</text>
  <text class="p" x="304" y="183" fill="#4c9aff">backend/app/api</text>
  <text class="d" x="304" y="206">FastAPI, DTOs, JWT e Swagger</text>
  <rect x="230" y="262" width="500" height="98" rx="14" fill="#111c31" stroke="#26354f" stroke-opacity="1" filter="url(#sombra)"/>
  <rect x="231" y="276" width="4" height="70" rx="2" fill="#2fd08f"/>
  <circle cx="272" cy="298" r="19" fill="#2fd08f" fill-opacity=".14" stroke="#2fd08f" stroke-opacity=".55"/>
  <g transform="translate(262.0 288.0) scale(0.8333)" fill="none" stroke="#2fd08f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="12" r="2.5"/><path d="M8.4 7.2 15.7 10.9M8.4 16.8 15.7 13.1"/></g>
  <text class="bt" x="304" y="296">Aplicação</text>
  <text class="p" x="304" y="317" fill="#2fd08f">backend/app/application</text>
  <text class="d" x="304" y="340">comandos, consultas e transação</text>
  <rect x="40" y="414" width="380" height="120" rx="14" fill="#111c31" stroke="#f5a524" stroke-opacity="0.85" filter="url(#sombra)"/>
  <rect x="41" y="428" width="4" height="92" rx="2" fill="#f5a524"/>
  <circle cx="82" cy="450" r="19" fill="#f5a524" fill-opacity=".14" stroke="#f5a524" stroke-opacity=".55"/>
  <g transform="translate(72.0 440.0) scale(0.8333)" fill="none" stroke="#f5a524" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5 20.5 7.25v9.5L12 21.5 3.5 16.75v-9.5z"/><path d="M12 8.2 15.4 10.1v3.8L12 15.8 8.6 13.9v-3.8z"/></g>
  <text class="bt" x="114" y="448">Domínio</text>
  <text class="p" x="114" y="469" fill="#f5a524">backend/app/domain</text>
  <text class="d" x="114" y="492">Agregados, entidades e value objects</text>
  <text class="d" x="114" y="512">Eventos de domínio e políticas</text>
  <rect x="540" y="414" width="380" height="120" rx="14" fill="#111c31" stroke="#26354f" stroke-opacity="1" filter="url(#sombra)"/>
  <rect x="541" y="428" width="4" height="92" rx="2" fill="#a78bfa"/>
  <circle cx="582" cy="450" r="19" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-opacity=".55"/>
  <g transform="translate(572.0 440.0) scale(0.8333)" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01" stroke-width="3"/></g>
  <text class="bt" x="614" y="448">Infraestrutura</text>
  <text class="p" x="614" y="469" fill="#a78bfa">backend/app/infrastructure</text>
  <text class="d" x="614" y="492">SQLAlchemy, repositórios e seed</text>
  <text class="d" x="614" y="512">JWT e PostgreSQL</text>
  <rect x="434.0" y="453.0" width="92" height="42" rx="12" fill="#16233d" stroke="#26354f"/>
  <text class="lbl" x="480" y="471.0" text-anchor="middle">implementa</text>
  <text class="lbl" x="480" y="485.0" text-anchor="middle">as portas</text>
  <rect x="630" y="580" width="200" height="58" rx="14" fill="#111c31" stroke="#38bdf8" stroke-opacity=".6" filter="url(#sombra)"/>
  <circle cx="660" cy="609" r="17" fill="#38bdf8" fill-opacity=".14" stroke="#38bdf8" stroke-opacity=".55"/>
  <g transform="translate(651.0 600.0) scale(0.7500)" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5.5" rx="7.5" ry="2.8"/><path d="M4.5 5.5v13c0 1.55 3.36 2.8 7.5 2.8s7.5-1.25 7.5-2.8v-13M4.5 12c0 1.55 3.36 2.8 7.5 2.8s7.5-1.25 7.5-2.8"/></g>
  <text class="bt" x="688" y="615">PostgreSQL 16</text>
  <text class="m" x="40" y="676">A aplicação usa o domínio e a infraestrutura. O domínio não importa framework nem o banco.</text>

</svg>
