<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1068 300" role="img">
  <title>Máquina de estados da ordem de serviço</title>
  <desc>Recebida, Em diagnóstico, Aguardando aprovação, Em execução, Finalizada e Entregue. De Aguardando aprovação também segue para Rejeitada.</desc>
  <rect width="1068" height="300" fill="#f6f3ec"/>
  <text x="24" y="34" font-family="sans-serif" font-size="20" font-weight="700" fill="#1e3a5f">Status da ordem de serviço</text>
  <text x="24" y="56" font-family="sans-serif" font-size="13" fill="#5c6570">Transições aceitas pelo agregado. Entregue e Rejeitada encerram a OS.</text>

  <rect x="16" y="96" width="112" height="50" rx="8" fill="#dbe7f5" stroke="#2c5282" stroke-width="1.5"/>
  <text x="72" y="126" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1e3a5f">Recebida</text>

  <line x1="128" y1="121" x2="156" y2="121" stroke="#3d4a5c" stroke-width="1.5"/>
  <polygon points="156,115 156,127 166,121" fill="#3d4a5c"/>
  <text x="146" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5c6570">diagnóstico</text>

  <rect x="166" y="96" width="156" height="50" rx="8" fill="#dbe7f5" stroke="#2c5282" stroke-width="1.5"/>
  <text x="244" y="126" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1e3a5f">Em diagnóstico</text>

  <line x1="322" y1="121" x2="348" y2="121" stroke="#3d4a5c" stroke-width="1.5"/>
  <polygon points="348,115 348,127 358,121" fill="#3d4a5c"/>
  <text x="340" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5c6570">orçamento</text>

  <rect x="358" y="96" width="196" height="50" rx="8" fill="#f8ead2" stroke="#8a5a12" stroke-width="1.5"/>
  <text x="456" y="126" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#6b4208">Aguardando aprovação</text>

  <line x1="554" y1="121" x2="580" y2="121" stroke="#3d4a5c" stroke-width="1.5"/>
  <polygon points="580,115 580,127 590,121" fill="#3d4a5c"/>
  <text x="572" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5c6570">aprovar</text>

  <rect x="590" y="96" width="140" height="50" rx="8" fill="#dbe7f5" stroke="#2c5282" stroke-width="1.5"/>
  <text x="660" y="126" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1e3a5f">Em execução</text>

  <line x1="730" y1="121" x2="756" y2="121" stroke="#3d4a5c" stroke-width="1.5"/>
  <polygon points="756,115 756,127 766,121" fill="#3d4a5c"/>
  <text x="748" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5c6570">finalizar</text>

  <rect x="766" y="96" width="124" height="50" rx="8" fill="#dbe7f5" stroke="#2c5282" stroke-width="1.5"/>
  <text x="828" y="126" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1e3a5f">Finalizada</text>

  <line x1="890" y1="121" x2="916" y2="121" stroke="#3d4a5c" stroke-width="1.5"/>
  <polygon points="916,115 916,127 926,121" fill="#3d4a5c"/>
  <text x="908" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5c6570">entregar</text>

  <rect x="926" y="96" width="118" height="50" rx="8" fill="#e5f0e4" stroke="#2f6b4f" stroke-width="1.5"/>
  <text x="985" y="126" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1e4d34">Entregue</text>

  <line x1="456" y1="146" x2="456" y2="204" stroke="#3d4a5c" stroke-width="1.5"/>
  <polygon points="450,204 462,204 456,214" fill="#3d4a5c"/>
  <text x="470" y="188" font-family="sans-serif" font-size="11" fill="#5c6570">rejeitar</text>

  <rect x="386" y="214" width="140" height="48" rx="8" fill="#f8e0d8" stroke="#9b3d2f" stroke-width="1.5"/>
  <text x="456" y="244" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#7a2e24">Rejeitada</text>
</svg>
